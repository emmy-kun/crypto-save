<!DOCTYPE html>
<html>

<head>
  <title>Sign Up - Crypto Save</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

  <div class="login-container">

    <div class="login-card">

      <div class="login-logo">
        <img src="cryptosave2.png" alt="Logo" />
      </div>

      <p class="subtitle">Create your crypto dashboard account</p>

      <input id="username" placeholder="Username" class="input-field">
      <input id="password" type="password" placeholder="Password" class="input-field">
      <input id="confirmPassword" type="password" placeholder="Confirm Password" class="input-field">

      <button onclick="signup()" class="login-btn" id="signupBtn">
        <span id="btnText">Sign Up</span>
        <span id="spinner" class="spinner hidden"></span>
      </button>

      <p class="subtitle" style="margin-top:15px;">
        Already have an account? <a href="index.html" style="color:#22c55e;">Sign in</a>
      </p>

    </div>

  </div>

  <script src="signup.js"></script>
</body>

</html>
